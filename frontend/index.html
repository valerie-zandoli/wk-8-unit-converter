<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter — Kilometers ⇄ Miles</title>
<meta name="description" content="Convert distances between kilometers and miles instantly. Sign in to save a private history of your conversions.">
<meta property="og:title" content="Unit Converter — Kilometers ⇄ Miles">
<meta property="og:description" content="Convert distances between kilometers and miles instantly. Sign in to save a private history of your conversions.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">

    <section class="card">
      <h1>Unit Converter</h1>
      <p class="subtitle">Kilometers ⇄ Miles</p>

      <form id="converter-form" novalidate>
        <div class="field">
          <label for="value">Number</label>
          <input type="number" id="value" inputmode="decimal" placeholder="Enter a number" step="any" required>
          <p class="field-error" id="value-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="direction">Direction</label>
          <select id="direction">
            <option value="km-to-mi">Kilometers → Miles</option>
            <option value="mi-to-km">Miles → Kilometers</option>
          </select>
        </div>

        <button type="submit" id="convert">Convert</button>
      </form>

      <p id="result" class="result" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="auth-header">
        <h2>Account</h2>
        <p class="hint">Sign in to save your conversion history — it's only ever visible to you.</p>
      </div>

      <div id="signed-out-view">
        <form id="auth-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" minlength="6" required>
          </div>
          <div class="auth-actions">
            <button type="submit" id="sign-in" class="secondary">Sign in</button>
            <button type="button" id="sign-up" class="secondary">Sign up</button>
          </div>
        </form>
        <p class="field-error" id="auth-error" role="alert"></p>
      </div>

      <div id="signed-in-view" hidden>
        <p>Signed in as <strong id="user-email"></strong></p>
        <button type="button" id="sign-out" class="secondary">Sign out</button>
      </div>
    </section>

    <section class="card" id="history-card" hidden>
      <div class="auth-header">
        <h2>History</h2>
        <button type="button" id="clear-history" class="secondary">Clear all</button>
      </div>
      <ul id="history-list" class="history-list" aria-live="polite" aria-relevant="additions removals"></ul>
      <p id="history-empty" class="hint" aria-live="polite" hidden>No conversions saved yet.</p>
    </section>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
